<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A1210">
<meta name="description" content="Rumo ao Estrelato - carreira de jogador de futebol, do interior a selecao.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rumo ao Estrelato</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1210; --bg2:#0F1B18; --panel:#142320; --panel2:#1A2E29;
  --line:#243D37; --chalk:#EFE9DA; --muted:#879E94;
  --lar:#E8622C; --ama:#F2C14E; --ok:#3DBB7E; --err:#D9453B;
  --disp:'Anton',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,sans-serif;
  --data:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  --r:4px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--chalk);font-family:var(--body)}
body{overscroll-behavior:none}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:540px;margin:0 auto;min-height:100vh;padding-bottom:80px}

/* ---- cartao do jogador (assinatura) ---- */
.cart{position:sticky;top:0;z-index:40;background:linear-gradient(160deg,#16302A 0%,#0C1815 62%);
  border-bottom:1px solid var(--line);padding:12px 14px 11px;display:flex;gap:12px;align-items:center}
.cart:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:repeating-linear-gradient(90deg,var(--lar) 0 20px,transparent 20px 40px);opacity:.6}
.cart .num{font-family:var(--disp);font-size:30px;line-height:.85;color:var(--lar);min-width:40px;text-align:center}
.cart .num small{display:block;font-family:var(--data);font-size:9px;letter-spacing:1.6px;color:var(--muted);margin-top:3px}
.cart .nm{font-family:var(--disp);font-size:17px;letter-spacing:.5px;text-transform:uppercase;line-height:1}
.cart .sb{font-family:var(--data);font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;margin-top:3px}
.cart .dir{margin-left:auto;text-align:right;font-family:var(--data)}
.cart .dir b{display:block;font-size:15px;font-weight:600}
.cart .dir span{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}

.wrap{padding:14px}
.sec{font-family:var(--data);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);
  margin:20px 2px 9px;display:flex;align-items:center;gap:8px}
.sec:first-child{margin-top:4px}
.sec:before{content:"";width:14px;height:1px;background:var(--lar)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.card+.card{margin-top:9px}
h1,h2,h3{font-family:var(--disp);font-weight:400;letter-spacing:.5px;text-transform:uppercase;margin:0}
.mono{font-family:var(--data);font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px}
.kpi span{font-family:var(--data);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);display:block}
.kpi b{font-family:var(--data);font-size:19px;font-weight:700;display:block;margin-top:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--lar);color:#0A1210;
  font-family:var(--data);font-weight:700;font-size:14px;letter-spacing:1.2px;text-transform:uppercase;
  padding:13px 16px;border-radius:var(--r);width:100%;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.sec2{background:transparent;border:1px solid var(--line);color:var(--chalk)}
.btn.gh{background:var(--panel2);color:var(--chalk)}
.btn[disabled]{opacity:.4;pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--data);font-size:12px;letter-spacing:.8px;text-transform:uppercase;padding:7px 10px;
  border:1px solid var(--line);border-radius:20px;color:var(--muted);background:var(--panel)}
.chip.on{border-color:var(--lar);color:var(--lar)}
input[type=text]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;font-size:16px;color:var(--chalk);outline:none}
input[type=text]:focus{border-color:var(--lar)}

/* atributos */
.at{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(36,61,55,.6)}
.at .lb{font-family:var(--data);font-size:13px;letter-spacing:.8px;text-transform:uppercase;width:104px;color:var(--muted)}
.at .tr{flex:1;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;position:relative}
.at .tr i{display:block;height:100%;background:var(--lar)}
.at .tr u{position:absolute;top:-2px;width:2px;height:9px;background:var(--muted);opacity:.7}
.at .vl{font-family:var(--data);font-weight:700;font-size:16px;min-width:26px;text-align:right}
.at .up{width:30px;height:30px;border-radius:50%;border:1px solid var(--lar);color:var(--lar);
  font-family:var(--data);font-size:17px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center}
.at .up[disabled]{opacity:.25;border-color:var(--line);color:var(--muted)}

/* tabela */
table{width:100%;border-collapse:collapse;font-family:var(--data);font-variant-numeric:tabular-nums}
th{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:7px 3px;text-align:right;border-bottom:1px solid var(--line)}
th:nth-child(2){text-align:left}
td{padding:7px 3px;font-size:14px;text-align:right;border-bottom:1px solid rgba(36,61,55,.55)}
td:nth-child(2){text-align:left;font-family:var(--body);font-size:14px}
tr.eu td{background:rgba(232,98,44,.12);font-weight:700}
.zn{display:inline-block;width:3px;height:15px;vertical-align:-3px;margin-right:6px;border-radius:2px;background:transparent}
.zn.sob{background:var(--ok)}.zn.des{background:var(--err)}

/* lista simples */
.li{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-bottom:0;background:var(--panel);width:100%;text-align:left}
.li:first-of-type{border-radius:var(--r) var(--r) 0 0}
.li:last-of-type{border-bottom:1px solid var(--line);border-radius:0 0 var(--r) var(--r)}
.li .p{flex:1;min-width:0}
.li .p b{display:block;font-size:15px;font-weight:600}
.li .p span{font-family:var(--data);font-size:12px;color:var(--muted);letter-spacing:.4px}
.tag{font-family:var(--data);font-size:10px;font-weight:700;letter-spacing:.6px;padding:2px 6px;border-radius:2px}
.tag.ok{background:#16352A;color:var(--ok)}.tag.al{background:#3B2F10;color:var(--ama)}
.tag.er{background:#3A1512;color:#F09189}

/* partida */
.jogo{position:fixed;inset:0;z-index:70;background:var(--bg);max-width:540px;margin:0 auto;display:flex;flex-direction:column}
.jogo .top{padding:14px;border-bottom:1px solid var(--line);background:var(--bg2)}
.jogo .sc{display:flex;align-items:center;gap:12px;justify-content:center}
.jogo .sc .t{flex:1;text-align:center;font-family:var(--data);font-weight:600;font-size:13px;letter-spacing:.6px;text-transform:uppercase}
.jogo .sc .g{font-family:var(--disp);font-size:36px;line-height:.9}
.jogo .min{text-align:center;font-family:var(--data);font-size:12px;letter-spacing:2px;color:var(--lar);margin-top:8px}
.jogo .corpo{flex:1;overflow:auto;padding:14px}
.jogo .acoes{padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg2)}
.narra{font-size:15px;line-height:1.5;padding:8px 0;border-bottom:1px solid rgba(36,61,55,.55);animation:fd .25s}
.narra.eu{background:rgba(232,98,44,.08);margin:0 -14px;padding:10px 14px;border-bottom:0}
.narra .m{font-family:var(--data);font-weight:700;color:var(--muted);margin-right:8px}
.narra.gol .m{color:var(--lar)}
@keyframes fd{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.lance{background:var(--panel);border:1px solid var(--lar);border-radius:var(--r);padding:14px;margin:10px 0 4px}
.lance p{margin:0 0 4px;font-size:17px;line-height:1.4}
.opc{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 13px;margin-top:8px;display:flex;align-items:center;gap:10px}
.opc b{flex:1;font-size:15px;font-weight:600}
.opc span{font-family:var(--data);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.opc.o1{border-color:rgba(232,98,44,.5)}
.nota{font-family:var(--disp);font-size:44px;line-height:1;color:var(--lar)}

/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:45;background:#0B1614;border-top:1px solid var(--line);
  display:flex;max-width:540px;margin:0 auto;padding:7px 0 max(7px,env(safe-area-inset-bottom))}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);
  font-family:var(--data);font-size:10px;letter-spacing:.9px;text-transform:uppercase;padding:4px 0}
.nav button.on{color:var(--lar)}
.nav svg{width:21px;height:21px}

/* modal */
.mod{position:fixed;inset:0;z-index:60;background:rgba(3,8,7,.8);display:flex;align-items:flex-end;justify-content:center}
.mod>div{background:var(--bg2);border:1px solid var(--line);border-radius:10px 10px 0 0;width:100%;max-width:540px;
  max-height:88vh;overflow:auto;padding:16px 14px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(20px);opacity:.4}to{transform:none;opacity:1}}
.hero{padding:36px 16px 18px;text-align:center}
.hero h1{font-size:40px;line-height:.9;letter-spacing:1px}
.hero h1 em{font-style:normal;color:var(--lar);display:block}
.hero p{color:var(--muted);font-family:var(--data);letter-spacing:1.8px;text-transform:uppercase;font-size:11px;margin:10px 0 0}
:focus-visible{outline:2px solid var(--lar);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const el = id => document.getElementById(id);
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function poisson(l) { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; }
function moeda(n) {
  n = Math.round(n);
  if (Math.abs(n) >= 1e9) return 'R$ ' + (n / 1e9).toFixed(2).replace('.', ',') + ' bi';
  if (Math.abs(n) >= 1e6) return 'R$ ' + (n / 1e6).toFixed(Math.abs(n) >= 1e7 ? 1 : 2).replace('.', ',') + ' mi';
  if (Math.abs(n) >= 1e3) return 'R$ ' + Math.round(n / 1e3) + ' mil';
  return 'R$ ' + n;
}

  mem: {},
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { this.mem[k] = v; } },
  get(k) { try { const r = localStorage.getItem(k); return r === null ? (this.mem[k] || null) : r; } catch (e) { return this.mem[k] || null; } },

function abrevDe(nome, usados) {
  const limpo = nome.normalize('NFD').replace(/[^A-Za-z ]/g, '');
  const p = limpo.split(' ').filter(w => w.length > 1 || /^[A-Z]$/.test(w));
  const cand = [];
  if (p[0]) cand.push(p[0].slice(0, 3));
  if (p.length >= 3) cand.push(p[0][0] + p[1][0] + p[2][0]);
  if (p.length >= 2) cand.push(p[0].slice(0, 2) + p[1][0]);
  if (p.length >= 2) cand.push(p[0][0] + p[1].slice(0, 2));
  if (p[1]) cand.push(p[1].slice(0, 3));
  if (p[0]) cand.push(p[0].slice(0, 2) + (p[0][3] || p[0][2] || 'X'));
  if (p[0]) cand.push(p[0].replace(/[aeiouAEIOU]/g, '').slice(0, 3));
  if (p[1]) cand.push(p[1].replace(/[aeiouAEIOU]/g, '').slice(0, 3));
  for (const c of cand) {
    const ab = c.toUpperCase();
    if (ab.length === 3 && !usados[ab]) { usados[ab] = 1; return ab; }
  }
  let base = (p[0] || 'CLU').slice(0, 2).toUpperCase(), k = 1, ab;
  do { ab = base + (k++); } while (usados[ab]);
  usados[ab] = 1;
  return ab;
}

function calendarioDiv(ids) {
  const n = ids.length, fixo = ids[0];
  let rot = ids.slice(1), turno = [];
  for (let r = 0; r < n - 1; r++) {
    const lista = [fixo].concat(rot), jogos = [];
    for (let i = 0; i < n / 2; i++) {
      const a = lista[i], b = lista[n - 1 - i];
      jogos.push((r + i) % 2 === 0 ? { casa: a, fora: b } : { casa: b, fora: a });
    }
    turno.push(jogos); rot.unshift(rot.pop());
  }
  for (let i = turno.length - 1; i > 0; i--) { const j = ri(0, i); const t = turno[i]; turno[i] = turno[j]; turno[j] = t; }
  return turno.concat(turno.map(rr => rr.map(j => ({ casa: j.fora, fora: j.casa }))))
    .map(rr => rr.map(j => ({ casa: j.casa, fora: j.fora, pl: null })));
}

    '<p class="mut" style="margin:6px 0 14px;font-size:14px">17 anos, primeiro contrato profissional.</p>' +
    '<input type="text" id="nome" maxlength="22" placeholder="Nome do jogador" value="' + esc(UI.nome) + '">' +
    '<div class="sec">posicao</div><div class="chips">' + poss.map(p =>
      '<button class="chip ' + (UI.pos === p ? 'on' : '') + '" data-a="pos:' + p + '">' + POSICOES[p].nome + '</button>').join('') + '</div>' +
    '<div class="sec">estilo</div>' + estilos.map(e =>
      '<button class="li" data-a="estilo:' + e[0] + '"><span class="p"><b>' + e[1] + '</b><span>' + e[2] + '</span></span>' +
      (UI.estilo === e[0] ? '<span class="tag ok">ESCOLHIDO</span>' : '') + '</button>').join('') +
    '<div class="sec">clube</div>' +
    '<div class="chips">' + [2, 1, 0].map(d =>
      '<button class="chip ' + (UI.divSel === d ? 'on' : '') + '" data-a="divsel:' + d + '">' + DIVS[d] + '</button>').join('') + '</div>' +
    '<div class="mut" style="font-family:var(--data);font-size:12px;margin:8px 2px 8px;letter-spacing:.5px">' +
    'Quanto mais forte o clube, mais dificil comecar jogando. Na Serie C voce vira titular cedo; na Serie A voce briga por espaco.</div>' +
    (MUNDO ? MUNDO.filter(c => c.div === UI.divSel).sort((a, b) => b.nivel - a.nivel).map(c => {
      const facil = c.nivel <= 55 ? ['ok', 'TITULAR'] : c.nivel <= 66 ? ['al', 'DISPUTA'] : ['er', 'BANCO'];
      return '<button class="li" data-a="clube:' + c.id + '"><span class="p"><b>' + esc(c.nome) + '</b>' +
        '<span>forca ' + c.nivel + ' · ' + moeda(Math.round(salarioDe(c, 5) * 0.55 / 500) * 500) + ' por jogo</span></span>' +
        (UI.clube === c.id ? '<span class="tag ok">ESCOLHIDO</span>' : '<span class="tag ' + facil[0] + '">' + facil[1] + '</span>') + '</button>';
    }).join('') : '') +
    '<div style="height:14px"></div><button class="btn" data-a="comecar" ' + (UI.clube === null ? 'disabled' : '') + '>Assinar contrato ' + ic('seta', 16) + '</button>' +
    '<div style="height:9px"></div><button class="btn sec2" data-a="voltar">Voltar</button></div>';
}

/* ---------------- carreira ---------------- */
function telaCarreira() {
  const j = S.j, c = S.clubes[j.clube];
  if (S.aposentado) return telaAposentado();
  if (S.fase === 'resumo') return telaResumo();
  if (S.fase === 'mercado') return telaMercado();
  let bloco = '';
  if (S.evento) {
    return '<div class="wrap">' +
      '<div class="sec">decisao</div>' +
      '<div class="card" style="border-color:var(--ama)">' +
      '<div class="mono" style="font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ama)">fora das quatro linhas</div>' +
      '<p style="font-size:16px;line-height:1.45;margin:8px 0 4px">' + esc(S.evento.txt) + '</p>' +
      S.evento.ops.map((o, i) => '<button class="opc" data-a="evento:' + i + '"><b>' + esc(o) + '</b></button>').join('') +
      '</div>' +
      '<div class="mut" style="font-family:var(--data);font-size:12px;margin-top:10px;letter-spacing:.5px">' +
      'Toda escolha cobra alguma coisa: condicao, imagem, confianca do tecnico ou o seu proprio teto.</div></div>';
  }
  const info = proximoJogo();
  const status = j.lesao > 0 ? 'lesionado por ' + j.lesao + ' jogo(s)' : titular() ? 'voce comeca jogando' : 'voce comeca no banco';
  if (info && info.especial) {
    const meuNome = (S.fase === 'selecao' || S.fase === 'mundial') ? 'Brasil' : c.nome;
    bloco = '<div class="card" style="border-color:var(--ama)"><div class="mono" style="font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ama)">' +
      esc(info.comp) + ' · ' + esc(info.faseNome) + '</div>' +
      '<div style="font-family:var(--disp);font-size:19px;margin:5px 0 3px">' + esc(meuNome) + ' x ' + esc(info.adv.nome) + '</div>' +
      '<div class="mut" style="font-size:14px">Forca do adversario ' + info.adv.nivel + ' · ' + (S.fase === 'selecao' ? 'rodada tripla das Eliminatorias' : S.fase === 'mundial' && S.mundial.etapa === 'grupo' ? 'fase de grupos: empate vale ponto' : 'mata-mata: quem perde esta fora') + '</div>' +
      '<div style="height:11px"></div><button class="btn" data-a="jogar">' + (j.lesao > 0 ? 'Acompanhar do DM' : 'Entrar em campo') + ' ' + ic('seta', 16) + '</button>' +
      (S.fase === 'mundial' && S.mundial.etapa === 'grupo' ? tabelaGrupoHTML() : '') + '</div>';
  } else if (info) {
    const casa = info.casa === j.clube;
    const adv = S.clubes[casa ? info.fora : info.casa];
    bloco = '<div class="card"><div class="mono mut" style="font-size:11px;letter-spacing:1.6px;text-transform:uppercase">' + DIVS[c.div] + ' · rodada ' + (S.rodada + 1) + ' de ' + totalRodadas() + ' · ' + (casa ? 'em casa' : 'fora') + '</div>' +
      '<div style="font-family:var(--disp);font-size:19px;margin:5px 0 3px">' + esc(c.nome) + ' x ' + esc(adv.nome) + '</div>' +
      '<div class="mut" style="font-size:14px">Forca do adversario ' + adv.nivel + ' · ' + status + '</div>' +
      '<div style="height:11px"></div><button class="btn" data-a="jogar">' + (j.lesao > 0 ? 'Acompanhar do DM' : 'Entrar em campo') + ' ' + ic('seta', 16) + '</button></div>';
  }
  const janela = S.janelaAberta ? '<div class="sec">janela aberta</div>' +
    S.propostas.map((p, i) => {
      const cl = S.clubes[p.clube];
      return '<button class="li" data-a="aceitarm:' + i + '"><span class="p"><b>' + esc(cl.nome) + '</b>' +
        '<span>' + DIVS[cl.div] + ' · forca ' + cl.nivel + ' · ' + moeda(p.salario) + ' por jogo · ' + p.papel + '</span></span>' +
        '<span class="tag ' + (cl.div < c.div ? 'ok' : 'al') + '">' + (cl.div < c.div ? 'SUBIR' : cl.div > c.div ? 'DESCER' : 'TROCA') + '</span></button>';
    }).join('') + '<div style="height:9px"></div><button class="btn sec2" data-a="ignorar">Ficar no ' + esc(c.ab) + ' ate o fim da temporada</button>' : '';
  const media = j.st.j ? (j.st.nota / j.st.j).toFixed(1) : '-';
  if (S.modo === 'tecnico') {
    return '<div class="wrap">' +
      '<div class="grid3">' + kpi('Posicao', posLiga() + 'o') + kpi('Meta', 'ate ' + S.tec.meta + 'o') + kpi('Prestigio', Math.round(S.tec.prestigio)) + '</div>' +
      janela + '<div class="sec">proximo jogo</div>' + bloco +
      '<div class="sec">seu momento</div><div class="card">' +
      linhaEstado('Confianca da diretoria', S.tec.conf, S.tec.conf > 60 ? 'var(--ok)' : S.tec.conf > 30 ? 'var(--ama)' : 'var(--err)') +
      '<div class="row" style="justify-content:space-between;font-family:var(--data);font-size:13px">' +
      '<span class="mut">Salario por jogo</span><span>' + moeda(j.salario) + '</span></div>' +
      '<div class="row" style="justify-content:space-between;font-family:var(--data);font-size:13px">' +
      '<span class="mut">Em caixa</span><span>' + moeda(j.patrimonio) + '</span></div></div>' +
      '<div class="sec">noticias</div>' + noticiasHTML(5) +
      '</div>';
  }
  return '<div class="wrap">' +
    '<div class="grid3">' + kpi('Jogos', j.st.j) + kpi('Nota media', media) + kpi('Reputacao', reputacao()) + '</div>' +
    janela + '<div class="sec">proximo jogo</div>' + bloco +
    '<div class="sec">seu momento</div><div class="card">' +
    linhaEstado('Condicao fisica', j.cond, j.cond > 60 ? 'var(--ok)' : j.cond > 35 ? 'var(--ama)' : 'var(--err)') +
    linhaEstado('Forma', j.forma) +
    linhaEstado('Confianca do tecnico', j.conf) +
    linhaEstado('Imagem publica', j.imagem === undefined ? 60 : j.imagem, (j.imagem === undefined ? 60 : j.imagem) > 60 ? 'var(--ok)' : (j.imagem === undefined ? 60 : j.imagem) > 35 ? 'var(--ama)' : 'var(--err)') +
    '<div class="row" style="justify-content:space-between;margin-top:10px;font-family:var(--data);font-size:13px">' +
    '<span class="mut">Salario por jogo</span><span>' + moeda(j.salario) + '</span></div>' +
    '<div class="row" style="justify-content:space-between;font-family:var(--data);font-size:13px">' +
    '<span class="mut">Em caixa</span><span>' + moeda(j.patrimonio) + '</span></div>' +
    '<div class="row" style="justify-content:space-between;font-family:var(--data);font-size:13px">' +
    '<span class="mut">Custo da estrutura por jogo</span><span>' + (manutencao() ? '-' + moeda(manutencao()) : 'nada') + '</span></div></div>' +
    '<div class="sec">noticias</div>' + noticiasHTML(5) +
    '<div style="height:12px"></div><button class="btn sec2" data-a="apagar">Apagar carreira</button>' +
    '</div>';
}
function linhaEstado(l, v, cor) {
  return '<div style="margin-bottom:9px"><div class="row" style="justify-content:space-between;font-family:var(--data);font-size:13px;margin-bottom:4px">' +
    '<span class="mut">' + l + '</span><span>' + Math.round(v) + '%</span></div>' + barrinha(v, cor) + '</div>';
}

function tabelaGrupoHTML() {
  return '<div style="height:12px"></div><table><thead><tr><th>Grupo</th><th style="text-align:left"></th><th>P</th><th>GP</th><th>GC</th></tr></thead><tbody>' +
    tabelaGrupo().map((g, i) => '<tr class="' + (g.eu ? 'eu' : '') + '"><td>' + (i + 1) + '</td><td>' + esc(g.nome) + '</td>' +
      '<td>' + g.pts + '</td><td>' + g.gp + '</td><td>' + g.gc + '</td></tr>').join('') + '</tbody></table>' +
    '<div class="mono mut" style="font-size:11px;margin-top:7px">os dois primeiros avancam para o mata-mata</div>';
}

function posLiga() {
  return tabelaDiv(S.clubes[S.j.clube].div).findIndex(c => c.id === S.j.clube) + 1;
}

/* ---------------- jogador ---------------- */
function telaJogador() {
  const j = S.j;
  return '<div class="wrap">' +
    '<div class="grid3">' + kpi('Geral', j.ovr) + kpi('Potencial', estrelasPot() + '<span style="font-size:12px;color:var(--muted)"> ' + S.j.pot + '</span>') + kpi('Pontos', j.PE) + '</div>' +
    '<div class="sec">atributos</div><div class="card">' +
    ATRIBS.map(a => {
      const v = j.at[a[0]], custo = custoAtributo(v), pode = j.PE >= custo && v < j.pot;
      return '<div class="at"><span class="lb">' + a[1] + '</span>' +
        '<span class="tr"><i style="width:' + v + '%"></i><u style="left:' + clamp(j.pot, 0, 100) + '%"></u></span>' +
        '<span class="vl">' + v + '</span>' +
        '<button class="up" data-a="evoluir:' + a[0] + '" ' + (pode ? '' : 'disabled') + ' title="custa ' + custo + '">+</button></div>';
    }).join('') +
    '<div class="mut" style="font-family:var(--data);font-size:12px;margin-top:10px;letter-spacing:.5px">A marca cinza na barra e o seu teto de potencial. Cada ponto fica mais caro conforme o atributo sobe.</div></div>' +
    '<div class="sec">temporada ' + S.temporada + '</div>' +
    '<div class="grid3">' + kpi('Gols', j.st.g) + kpi('Assist.', j.st.a) + kpi('Craque', j.st.mvp) + '</div>' +
    '<div class="sec">carreira</div>' +
    '<div class="grid3">' + kpi('Jogos', j.carr.j) + kpi('Gols', j.carr.g) + kpi('Assist.', j.carr.a) + '</div>' +
    '<div class="sec">especialidades</div>' +
    '<div class="mut" style="font-family:var(--data);font-size:12px;margin:-2px 2px 8px;letter-spacing:.5px">Marcas registradas que mudam o seu jogo. A proxima custa ' + custoTraco() + ' pontos.</div>' +
    TRACOS.map(t => {
      const tem = temTraco(t[0]), pode = !tem && j.PE >= custoTraco();
      return '<button class="li" ' + (pode ? 'data-a="traco:' + t[0] + '"' : '') + '><span class="p"><b>' + t[1] + '</b>' +
        '<span>' + t[2] + '</span></span>' +
        (tem ? '<span class="tag ok">ATIVA</span>' : '<span class="tag ' + (pode ? 'al' : '') + '" style="' + (pode ? '' : 'color:var(--muted)') + '">' + custoTraco() + ' PTS</span>') + '</button>';
    }).join('') +
    (podeAposentar() ? '<div style="height:14px"></div><button class="btn sec2" data-a="aposentar">Pendurar as chuteiras</button>' : '') +
    '</div>';
}

/* ---------------- treino ---------------- */
function telaTreino() {
  const j = S.j;
  const ult = j.ultimoTreino ? '<div class="card"><span class="mono mut" style="font-size:11px;letter-spacing:1.4px;text-transform:uppercase">ultimo treino</span>' +
    '<div style="margin-top:4px">Foco em ' + esc(ATRIBS.filter(a => a[0] === j.ultimoTreino.foco)[0][1].toLowerCase()) + ': +' + j.ultimoTreino.ganho + ' ponto(s) de evolucao.</div></div>' : '';
  return '<div class="wrap">' +
    '<div class="grid2">' + kpi('Pontos disponiveis', j.PE) + kpi('Condicao', Math.round(j.cond) + '%') + '</div>' +
    '<div class="sec">foco do treino</div><div class="chips">' +
    ATRIBS.map(a => '<button class="chip ' + (UI.foco === a[0] ? 'on' : '') + '" data-a="foco:' + a[0] + '">' + a[1] + '</button>').join('') + '</div>' +
    '<div style="height:12px"></div>' +
    '<button class="btn" data-a="treinar" ' + (j.cond < 25 ? 'disabled' : '') + '>Treinar (custa condicao)</button>' +
    (j.cond < 25 ? '<div class="mut" style="font-family:var(--data);font-size:13px;margin-top:8px">Cansado demais. Jogue a proxima partida ou descanse.</div>' : '') +
    '<div style="height:9px"></div>' + ult +
    '<div class="sec">gastar pontos</div><div class="card">' +
    ATRIBS.map(a => {
      const v = j.at[a[0]], custo = custoAtributo(v), pode = j.PE >= custo && v < j.pot;
      return '<div class="at"><span class="lb">' + a[1] + '</span><span class="tr"><i style="width:' + v + '%"></i><u style="left:' + clamp(j.pot, 0, 100) + '%"></u></span>' +
        '<span class="vl">' + v + '</span><button class="up" data-a="evoluir:' + a[0] + '" ' + (pode ? '' : 'disabled') + '>+</button></div>';
    }).join('') + '</div></div>';
}

/* ---------------- vida fora de campo ---------------- */
function telaVida() {
  const j = S.j;
  const gasto = manutencao();
  const liquido = j.salario + (S.patro && S.patro.restante > 0 ? S.patro.jogo : 0) - gasto;
  const abas = [['estrutura', 'Estrutura'], ['patro', 'Patrocinio'], ['clube', 'Seu clube'], ['dinheiro', 'Dinheiro']];
  let corpo = '';
  if (UI.abaVida === 'patro') corpo = blocoPatrocinio();
  else if (UI.abaVida === 'clube') corpo = blocoClube();
  else if (UI.abaVida === 'dinheiro') corpo = blocoDinheiro();
  else corpo = blocoEstrutura();
  return '<div class="wrap">' +
    '<div class="grid3">' + kpi('Em caixa', moeda(j.patrimonio)) + kpi('Aplicado', moeda(j.investido || 0)) + kpi('Por jogo', moeda(liquido)) + '</div>' +
    '<div class="chips" style="margin-top:12px">' + abas.map(a =>
      '<button class="chip ' + (UI.abaVida === a[0] ? 'on' : '') + '" data-a="abavida:' + a[0] + '">' + a[1] + '</button>').join('') + '</div>' +
    '<div style="height:14px"></div>' + corpo + '</div>';
}
function blocoEstrutura() {
  const j = S.j, gasto = manutencao();
  return '<div class="card" style="margin-bottom:9px">' +
    '<div class="row" style="justify-content:space-between;font-family:var(--data);font-size:13px"><span class="mut">Salario por jogo</span><span>' + moeda(j.salario) + '</span></div>' +
    '<div class="row" style="justify-content:space-between;font-family:var(--data);font-size:13px"><span class="mut">Custo da sua estrutura</span><span style="color:' + (gasto ? 'var(--err)' : 'var(--muted)') + '">' + (gasto ? '-' + moeda(gasto) : 'nada') + '</span></div>' +
    '<div class="mut" style="font-size:13px;margin-top:8px;line-height:1.4">Se o caixa zerar, o contrato mais caro e encerrado. Escolha o que cabe no seu momento.</div></div>' +
    ITENS.map(it => {
      const tem = temItem(it[0]), pode = !tem && j.patrimonio >= it[3];
      return '<button class="li" ' + (pode ? 'data-a="comprar:' + it[0] + '"' : '') + '><span class="p"><b>' + it[1] + '</b>' +
        '<span>' + it[2] + ' · ' + moeda(it[3]) + (it[4] ? ' + ' + moeda(it[4]) + ' por jogo' : '') + '</span></span>' +
        (tem ? '<span class="tag ok">ATIVO</span>' : '<span class="tag ' + (pode ? 'al' : '') + '" style="' + (pode ? '' : 'color:var(--muted)') + '">' + (pode ? 'CONTRATAR' : 'CARO') + '</span>') + '</button>';
    }).join('');
}
function blocoDinheiro() {
  const j = S.j;
  return '<div class="card"><div class="mut" style="font-size:14px;line-height:1.45">Dinheiro aplicado rende entre 5% e 11% por temporada. Nao entra no caixa ate voce resgatar.</div>' +
    '<div class="grid2" style="margin-top:11px">' +
    '<button class="btn gh" data-a="aplicar">Aplicar metade do caixa</button>' +
    '<button class="btn sec2" data-a="resgatar">Resgatar tudo</button></div></div>' +
    '<div class="card" style="margin-top:9px">' +
    '<div class="row" style="justify-content:space-between;font-family:var(--data);font-size:13px"><span class="mut">Salario por jogo</span><span>' + moeda(j.salario) + '</span></div>' +
    (S.patro && S.patro.restante > 0 ? '<div class="row" style="justify-content:space-between;font-family:var(--data);font-size:13px"><span class="mut">Patrocinio por jogo</span><span>' + moeda(S.patro.jogo) + '</span></div>' +
      '<div class="row" style="justify-content:space-between;font-family:var(--data);font-size:13px"><span class="mut">Bonus por gol</span><span>' + moeda(S.patro.gol) + '</span></div>' : '') +
    '<div class="row" style="justify-content:space-between;font-family:var(--data);font-size:13px"><span class="mut">Estrutura por jogo</span><span style="color:' + (manutencao() ? 'var(--err)' : 'var(--muted)') + '">' + (manutencao() ? '-' + moeda(manutencao()) : 'nada') + '</span></div>' +
    (meusClubes().length ? '<div class="row" style="justify-content:space-between;font-family:var(--data);font-size:13px"><span class="mut">Seus clubes por temporada</span><span style="color:' + (resultadoTodosClubes() >= 0 ? 'var(--ok)' : 'var(--err)') + '">' + moeda(resultadoTodosClubes()) + '</span></div>' : '') +
    '</div>';
}
function blocoPatrocinio() {
  const j = S.j, p = S.patro;
  const ativo = p && p.restante > 0;
  let html = '';
  if (ativo) {
    html += '<div class="card"><div class="mono" style="font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ama)">' + esc(TIER_NOME[p.tier]) + '</div>' +
      '<div style="font-family:var(--disp);font-size:22px;margin:4px 0 2px">' + esc(p.nome) + '</div>' +
      '<div class="row" style="justify-content:space-between;font-family:var(--data);font-size:13px;margin-top:6px">' +
      '<span class="mut">Por jogo</span><span>' + moeda(p.jogo) + '</span></div>' +
      '<div class="row" style="justify-content:space-between;font-family:var(--data);font-size:13px">' +
      '<span class="mut">Bonus por gol</span><span>' + moeda(p.gol) + '</span></div>' +
      '<div class="row" style="justify-content:space-between;font-family:var(--data);font-size:13px">' +
      '<span class="mut">Temporadas restantes</span><span>' + p.restante + '</span></div></div>';
    return html;
  }
  const ofertas = ofertasPatrocinio();
  html += '<div class="card mut" style="font-size:14px;line-height:1.45;margin-bottom:9px">' +
    (p ? 'Voce esta sem contrato de material. ' : 'Ninguem chega na Nike de primeira. ') +
    'As marcas olham a sua reputacao e a sua imagem antes de bater o martelo.</div>';
  html += ofertas.map(m => '<button class="li" data-a="patrocinio:' + m[0] + '"><span class="p"><b>' + esc(m[1]) + '</b>' +
    '<span>' + TIER_NOME[m[2]] + ' · ' + moeda(m[5]) + ' por jogo · ' + moeda(m[6]) + ' por gol · ' + m[9] + ' temporadas</span></span>' +
    '<span class="tag al">' + moeda(m[7]) + '</span></button>').join('');
  const proxima = MARCAS.filter(m => reputacao() < m[3] || (S.j.imagem === undefined ? 60 : S.j.imagem) < m[4]).sort((a, b) => a[3] - b[3])[0];
  if (proxima) html += '<div class="mut" style="font-family:var(--data);font-size:12px;margin-top:8px;letter-spacing:.5px">Proximo degrau: ' +
    esc(proxima[1]) + ' pede reputacao ' + proxima[3] + ' e imagem ' + proxima[4] + '.</div>';
  return html;
}
function linhaFin(rot, valor, cor) {
  return '<div class="row" style="justify-content:space-between;font-family:var(--data);font-size:13px;padding:2px 0">' +
    '<span class="mut">' + rot + '</span><span' + (cor ? ' style="color:' + cor + '"' : '') + '>' + moeda(valor) + '</span></div>';
}

function atualizarPlacar() {

function passoPartida() {
  while (P.i < P.linha.length) {
    const it = P.linha[P.i];
    if (it.tipo === 'momento') { mostrarLance(it); return; }
    P.i++;
    if (it.tipo === 'golTime') { P.gMeuTime++; narrar(it.min, 'Gol do seu time: ' + it.autor + ' marcou.', 'gol'); }
    else if (it.tipo === 'golAdv') { P.gAdv++; narrar(it.min, 'O adversario marcou com ' + it.autor + '.'); }
    else if (it.tipo === 'entrada') { narrar(it.min, 'O tecnico te chama: voce entra em campo.', 'eu'); }
    atualizarPlacar();
  }
  terminarPartida();

function mostrarLance(it) {

    '<button class="btn sec2" data-a="auto">Resolver o resto no automatico</button>';
}
const PESO_AUTO = {
  ATA: { chute: 4.2, passe: 1.0, drible: 0.9, desarme: 1.0, seguro: 0.3 },
  PON: { chute: 3.6, passe: 1.1, drible: 1.0, desarme: 1.0, seguro: 0.3 },
  MEI: { chute: 2.6, passe: 1.4, drible: 1.0, desarme: 1.1, seguro: 0.4 },
  VOL: { chute: 2.0, passe: 1.3, drible: 0.9, desarme: 1.6, seguro: 0.5 },
  LAT: { chute: 2.0, passe: 1.3, drible: 1.0, desarme: 1.6, seguro: 0.5 },
  ZAG: { chute: 1.9, passe: 1.2, drible: 0.8, desarme: 1.8, seguro: 0.55 }
};
function autoResolver() {
  let guard = 0;
  while (P && !P.fim && P.i < P.linha.length && guard++ < 80) {
    const it = P.linha[P.i];
    if (!it || it.tipo !== 'momento') { passoPartida(); continue; }
    let melhor = 0, val = -1;
    it.mod.o.forEach((o, k) => {
      const v = chanceLance(o, it) * ((PESO_AUTO[S.j.pos] || PESO_AUTO.MEI)[o[3]] || 1);
      if (v > val) { val = v; melhor = k; }
    });
    escolherLance(melhor);
  }
}
function escolherLance(k) {
  const it = P.linha[P.i], op = it.mod.o[k];
  const r = resolverLance(op, it);
  const lance = el('corpo').querySelector('.lance:last-of-type');
  if (lance) lance.remove();
  narrar(it.min, op[0] + '. ' + r.txt, r.gol ? 'eu gol' : 'eu');
  P.bonus += r.delta;
  if (r.assist) { P.assist++; P.gMeuTime++; }
  else if (r.gol) { P.meusGols++; }
  if (r.cartao) {
    P.cartao++;
    narrar(it.min, P.cartao >= 2 ? 'Segundo amarelo. Voce esta expulso.' : 'Cartao amarelo pra voce.');
    if (P.cartao >= 2) { P.bonus -= 1.2; P.i = P.linha.length; el('acoes').innerHTML = ''; terminarPartida(); return; }
  }
  if (r.extra && Math.random() < 0.5) {
    P.linha.splice(P.i + 1, 0, { tipo: 'momento', min: Math.min(90, it.min + 1), mod: pick(MOM.ATQ), bonusDif: -9 });
  }
  if (Math.random() < 0.012) { P.lesao = 1; narrar(it.min, 'Voce sente a coxa e sai de campo.'); P.i = P.linha.length; atualizarPlacar(); el('acoes').innerHTML = ''; terminarPartida(); return; }
  P.i++;
  atualizarPlacar();
  el('acoes').innerHTML = '';
  passoPartida();
}

function render() {
  const app = el('app');
  if (!S) { app.innerHTML = TELA === 'criacao' ? telaCriacao() : telaInicio(); return; }
  if (TELA === 'criacao') { app.innerHTML = telaCriacao(); return; }
  if (S.festas && S.festas.length) { app.innerHTML = barra() + telaCampeao(); return; }
  if (S.bancos) { app.innerHTML = barra() + telaEscolherBanco(); return; }
  if (S.aposentado) { app.innerHTML = barra() + telaAposentado(); return; }
  if (S.fase === 'resumo' || S.fase === 'mercado') { app.innerHTML = barra() + telaCarreira(); return; }
  let corpo = '';
  if (TELA === 'jogador') corpo = telaJogador();
  else if (TELA === 'treino') corpo = telaTreino();
  else if (TELA === 'vida') corpo = telaVida();
  else if (TELA === 'liga') corpo = telaLiga();
  else if (TELA === 'hist') corpo = telaHist();
  else corpo = telaCarreira();
  app.innerHTML = barra() + corpo + nav();
}

function modalResultado(res) {
  abrirModal('<h3>' + esc(res.escolha) + '</h3>' +
    '<div class="mono mut" style="font-size:11px;letter-spacing:1.4px;text-transform:uppercase;margin:2px 0 10px">no que deu</div>' +
    res.linhas.map(linhaEfeito).join('') +
    (res.risco ? '<div class="card" style="margin-top:12px;border-color:var(--err)">' +
      '<div class="mono" style="font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--err)">deu ruim</div>' +
      '<p style="font-size:15px;line-height:1.45;margin:6px 0 8px">' + esc(res.risco.txt) + '</p>' +
      res.risco.linhas.map(linhaEfeito).join('') + '</div>' : '') +
    (res.escapou ? '<div class="card" style="margin-top:12px;border-color:var(--ok)">' +
      '<div class="mono" style="font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ok)">passou batido</div>' +
      '<p class="mut" style="font-size:15px;line-height:1.45;margin:6px 0 0">Dessa vez ninguem ficou sabendo. Nem sempre vai ser assim.</p></div>' : '') +
    '<div style="height:12px"></div><button class="btn" data-a="fechar">Seguir</button>');
}
function alerta(t, x) { abrirModal('<h3>' + esc(t) + '</h3><p class="mut" style="font-size:15px;line-height:1.45">' + esc(x) + '</p><button class="btn" data-a="fechar">Ok</button>'); }

/* ---------------- acoes ---------------- */
document.addEventListener('click', e => {
  const alvo = e.target.closest('[data-a]');
  if (!alvo) return;
  const [a, p1, p2] = alvo.dataset.a.split(':');
  if (a === 'fechar-fundo' && e.target !== alvo) return;
  switch (a) {
    case 'criar': MUNDO = criarMundo(); UI.clube = null; UI.divSel = 2; TELA = 'criacao'; render(); break;
    case 'voltar': TELA = 'carreira'; render(); break;
    case 'continuar-save': if (carregar()) { TELA = 'carreira'; render(); } else alerta('Sem carreira salva', 'Nao encontrei um jogo salvo neste aparelho.'); break;
    case 'pos': capturaNome(); UI.pos = p1; render(); break;
    case 'estilo': capturaNome(); UI.estilo = p1; render(); break;
    case 'divsel': capturaNome(); UI.divSel = Number(p1); render(); break;
    case 'clube': capturaNome(); UI.clube = Number(p1); render(); break;
    case 'comecar': {
      capturaNome();
      const n = UI.nome.trim() || 'Jogador';
      novaCarreira(n, UI.pos, UI.estilo, UI.clube); TELA = 'carreira'; render(); break;
    }
    case 'selclube': UI.clubeView = (p1 === 'grupo' ? 'grupo' : Number(p1)); UI.comprando = false; render(); break;
    case 'comprarnovo': UI.comprando = true; render(); break;
    case 'reinveste': { const m = meusClubes()[Number(p1)]; m.reinveste = !m.reinveste; salvar(); render(); break; }
    case 'venderclube': {
      const m = meusClubes()[Number(p1)];
      const bal = balancoClube(m), receb = precoVenda(m) + bal.caixa, liquido = receb + bal.recebido - bal.gasto;
      abrirModal('<h3>Vender o ' + esc(clubeDe(m).nome) + '</h3>' +
        '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(36,61,55,.5);font-family:var(--data);font-size:14px"><span class="mut">Voce recebe agora</span><span>' + moeda(receb) + '</span></div>' +
        '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(36,61,55,.5);font-family:var(--data);font-size:14px"><span class="mut">Lucros ja sacados</span><span>' + moeda(bal.recebido) + '</span></div>' +
        '<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(36,61,55,.5);font-family:var(--data);font-size:14px"><span class="mut">Total investido</span><span style="color:var(--err)">-' + moeda(bal.gasto) + '</span></div>' +
        '<div class="row" style="justify-content:space-between;padding:8px 0;font-family:var(--data);font-size:16px;font-weight:700"><span>' + (liquido >= 0 ? 'Lucro' : 'Prejuizo') + '</span><span style="color:' + (liquido >= 0 ? 'var(--ok)' : 'var(--err)') + '">' + moeda(Math.abs(liquido)) + '</span></div>' +
        '<p class="mut" style="font-size:14px;line-height:1.45">Libera a vaga para outro projeto. Nao da pra desfazer.</p>' +
        '<button class="btn" data-a="venderclube-ok:' + p1 + '">Vender</button><div style="height:8px"></div><button class="btn sec2" data-a="fechar">Cancelar</button>');
      break;
    }
    case 'venderclube-ok': { fecharModal(); const err = venderClube(Number(p1)); if (err) alerta('Nao deu', err); else { UI.clubeView = 'grupo'; UI.comprando = false; render(); } break; }
    case 'patrocinio': { const err = assinarPatrocinio(p1); if (err) alerta('Nao rolou', err); else render(); break; }
    case 'comprarclube': { const err = comprarClube(Number(p1)); if (err) alerta('Nao deu', err); else { UI.comprando = false; UI.clubeView = meusClubes().length - 1; render(); } break; }
    case 'investir': { const err = investirClube(Number(p1), p2); if (err) alerta('Nao deu', err); else render(); break; }
    case 'virartec': {
      const rep = reputacao();
      S.bancos = S.clubes.filter(c => c.nivel <= 40 + rep * 0.55).sort((a, b) => b.nivel - a.nivel).slice(0, 6);
      if (!S.bancos.length) S.bancos = S.clubes.slice().sort((a, b) => a.nivel - b.nivel).slice(0, 6);
      render(); break;
    }
    case 'cancelartec': S.bancos = null; render(); break;
    case 'assumir': { const id = Number(p1); S.bancos = null; virarTecnico(id); TELA = 'carreira'; render(); break; }
    case 'assumirprop': { assumirClube(Number(p1)); novaTemporada(); TELA = 'carreira'; render(); break; }
    case 'plano': escolherPlano(Number(p1)); break;
    case 'ajuste': escolherAjuste(Number(p1)); break;
    case 'evento': { const res = decidirEvento(Number(p1)); render(); modalResultado(res); break; }
    case 'fechar-festa': if (S.festas) S.festas.shift(); salvar(); render(); break;
    case 'nav': TELA = p1; render(); break;
    case 'jogar': iniciarPartida(); break;
    case 'lance': escolherLance(Number(p1)); break;
    case 'auto': autoResolver(); break;
    case 'sair-partida': el('overlay').innerHTML = ''; P = null; render(); break;
    case 'comprar': { const err = comprarItem(p1); if (err) alerta('Nao deu', err); else render(); break; }
    case 'aplicar': { const v = Math.floor(S.j.patrimonio / 2 / 1000) * 1000; const err = investir(v); if (err) alerta('Nao deu', err); else { render(); alerta('Aplicado', moeda(v) + ' investidos. Rende no fim de cada temporada.'); } break; }
    case 'resgatar': { const v = S.j.investido || 0; const err = resgatar(v); if (err) alerta('Nao deu', err); else { render(); alerta('Resgatado', moeda(v) + ' de volta ao caixa.'); } break; }
    case 'traco': { const err = comprarTraco(p1); if (err) alerta('Nao rolou', err); else { render(); alerta('Nova especialidade', TRACOS.filter(t => t[0] === p1)[0][1] + ' desbloqueada.'); } break; }
    case 'evoluir': { const err = evoluir(p1); if (err) alerta('Nao rolou', err); else render(); break; }
    case 'foco': UI.foco = p1; render(); break;
    case 'treinar': { const g = treinar(UI.foco); if (!g) alerta('Sem gas', 'Sua condicao esta baixa demais para treinar.'); render(); break; }
    case 'aba': UI.abaLiga = p1; render(); break;
    case 'abavida': UI.abaVida = p1; render(); break;
    case 'mercado': if (S.modo === 'tecnico') gerarPropostasTec(); else gerarPropostas(); S.fase = 'mercado'; salvar(); render(); break;
    case 'aceitar': aceitarProposta(Number(p1)); novaTemporada(); TELA = 'carreira'; render(); break;
    case 'aceitarm': { const nome = S.clubes[S.propostas[Number(p1)].clube].nome; aceitarProposta(Number(p1)); render(); alerta('Contrato assinado', 'Voce ja veste a camisa do ' + nome + ' no restante da temporada.'); break; }
    case 'ignorar': S.janelaAberta = false; S.propostas = []; salvar(); render(); break;
    case 'pedir': { const q = pedirSaida(); render(); alerta(q ? 'Empresario trabalhou' : 'Ninguem apareceu', q ? 'Chegaram ' + q + ' proposta(s). O tecnico perdeu um pouco da confianca em voce.' : 'Nenhum clube ofereceu nada agora, e o tecnico ficou sabendo do seu pedido.'); break; }
    case 'ficar': novaTemporada(); TELA = 'carreira'; render(); break;
    case 'aposentar':
      abrirModal('<h3>Pendurar as chuteiras</h3><p class="mut" style="font-size:15px">Encerra a carreira agora e mostra o balanco final.</p>' +
        '<button class="btn" data-a="aposentar-ok">Encerrar carreira</button><div style="height:8px"></div><button class="btn sec2" data-a="fechar">Voltar</button>');
      break;
    case 'aposentar-ok': fecharModal(); aposentar(); render(); break;
    case 'apagar':
      abrirModal('<h3>Apagar carreira</h3><p class="mut" style="font-size:15px">Isso remove o jogo salvo neste aparelho.</p>' +
        '<button class="btn" data-a="apagar-ok">Apagar</button><div style="height:8px"></div><button class="btn sec2" data-a="fechar">Cancelar</button>');
      break;
    case 'apagar-ok': fecharModal(); apagar(); break;
    case 'fechar': case 'fechar-fundo': fecharModal(); break;
  }
});

(function () { if (carregar()) { TELA = 'carreira'; render(); } else render(); })();

</script>
</body>
</html>
